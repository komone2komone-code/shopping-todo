<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8f4fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>買い物＆TODO</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 id="page-title">買い物リスト</h1>
      <form id="add-form" class="add-form">
        <button type="button" id="voice-btn-list" class="btn-voice" aria-label="音声入力">
          <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="#ff8fab"/>
            <path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 17v3" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 20h8" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <input
          type="text"
          id="item-input"
          class="item-input"
          placeholder="買うものを入力"
          autocomplete="off"
          enterkeyhint="done"
        >
        <button type="submit" class="btn-add" aria-label="追加">追加</button>
      </form>
      <p id="voice-status" class="voice-status hidden" role="status"></p>
    </header>

    <main class="main">
      <section id="shopping-view" class="list-view" data-theme="shopping">
        <ul id="shopping-list" class="item-list"></ul>
        <p id="shopping-empty" class="empty-message">まだ何もありません</p>
        <button type="button" id="clear-shopping-done" class="btn-clear">
          購入済みをまとめて削除
        </button>
      </section>

      <section id="todo-view" class="list-view hidden" data-theme="todo">
        <ul id="todo-list" class="item-list"></ul>
        <p id="todo-empty" class="empty-message">まだ何もありません</p>
        <button type="button" id="clear-todo-done" class="btn-clear">
          完了済みをまとめて削除
        </button>
      </section>

      <section id="memo-view" class="memo-view hidden" data-theme="memo">
        <div class="memo-toolbar">
          <button type="button" id="voice-btn-memo" class="btn-voice" aria-label="音声入力">
            <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="#ff8fab"/>
              <path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
              <path d="M12 17v3" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 20h8" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <p id="voice-status-memo" class="voice-status hidden" role="status"></p>
        </div>
        <textarea
          id="memo-text"
          class="memo-text"
          placeholder="思いついたことを自由に書いてください"
        ></textarea>
        <button type="button" id="clear-memo" class="btn-clear">メモを消去</button>
      </section>
    </main>

    <nav class="tab-bar" role="tablist">
      <button type="button" id="tab-shopping" class="tab-btn active" role="tab" aria-selected="true">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 10l1.2 9h7.6L17 10H7z" fill="#a8d8f0" stroke="#6bb8e0" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M9 10V7a3 3 0 0 1 6 0v3" fill="none" stroke="#6bb8e0" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="tab-label">買い物</span>
      </button>
      <button type="button" id="tab-todo" class="tab-btn" role="tab" aria-selected="false">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="#f8c8dc" stroke="#e89ab8" stroke-width="1.2"/>
          <path d="M8 12.5l2.5 2.5 5.5-5.5" fill="none" stroke="#d86a9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tab-label">TODO</span>
      </button>
      <button type="button" id="tab-memo" class="tab-btn" role="tab" aria-selected="false">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 8a5 5 0 0 1 10 0c0 2.5-1.5 4-3 5.5H8C6.5 12 5 10.5 5 8z" fill="#fff3b0" stroke="#e8c84a" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="9" cy="9" r="0.8" fill="#e8c84a"/>
          <circle cx="12" cy="8" r="0.8" fill="#e8c84a"/>
          <circle cx="15" cy="9" r="0.8" fill="#e8c84a"/>
        </svg>
        <span class="tab-label">メモ</span>
      </button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
