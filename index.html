<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>買い物＆記憶メモリ＆メモ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="memo">
  <div class="app">
    <header class="header">
      <div class="header-top">
        <h1 id="page-title">メモ</h1>
        <button type="button" id="memory-add-btn" class="btn-memory-add" aria-label="ブロックを追加">＋</button>
      </div>
      <form id="add-form" class="add-form">
        <button type="button" id="voice-btn-list" class="btn-voice" aria-label="音声入力">
          <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="#ff8fab"/>
            <path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 17v3" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 20h8" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <input
          type="text"
          id="item-input"
          class="item-input"
          placeholder="買うものを入力"
          autocomplete="off"
          enterkeyhint="done"
        >
        <button type="submit" class="btn-add" aria-label="追加">追加</button>
      </form>
      <p id="voice-status" class="voice-status hidden" role="status"></p>
    </header>

    <main class="main">
      <section id="shopping-view" class="list-view hidden" data-theme="shopping">
        <ul id="shopping-list" class="item-list"></ul>
        <p id="shopping-empty" class="empty-message">まだ何もありません</p>
        <button type="button" id="clear-shopping-done" class="btn-clear">
          購入済みをまとめて削除
        </button>
      </section>

      <section id="memory-view" class="memory-view hidden" data-theme="memory">
        <article id="memory-jumble" class="memory-card memory-jumble" tabindex="0" role="button">
          <h2 class="memory-card-title">ごちゃまぜ覚書き</h2>
          <p id="memory-jumble-preview" class="memory-card-preview memory-card-empty">思いついたことを何でも書く</p>
        </article>
        <div id="memory-grid" class="memory-grid"></div>
      </section>

      <section id="memo-view" class="memo-view" data-theme="memo">
        <div class="memo-toolbar">
          <button type="button" id="voice-btn-memo" class="btn-voice" aria-label="音声入力">
            <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="#ff8fab"/>
              <path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
              <path d="M12 17v3" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 20h8" stroke="#ff8fab" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <p id="voice-status-memo" class="voice-status hidden" role="status"></p>
        </div>
        <textarea
          id="memo-text"
          class="memo-text"
          placeholder="思いついたことを自由に書いてください"
        ></textarea>
        <button type="button" id="clear-memo" class="btn-clear">メモを消去</button>

        <section class="backup-section" aria-labelledby="backup-title">
          <h2 id="backup-title" class="backup-title">データのバックアップ</h2>
          <p class="backup-desc">買い物・TODO・メモをまとめて保存・復元できます</p>
          <div class="backup-actions">
            <button type="button" id="backup-export" class="btn-backup">
              バックアップを書き出す
            </button>
            <button type="button" id="backup-import" class="btn-backup">
              バックアップを読み込む
            </button>
          </div>
          <input
            type="file"
            id="backup-file"
            class="backup-file"
            accept="application/json,.json"
          >
          <p id="backup-message" class="backup-message hidden" role="status"></p>
        </section>
      </section>
    </main>

    <nav class="tab-bar" role="tablist">
      <button type="button" id="tab-shopping" class="tab-btn" role="tab" aria-selected="false">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 10l1.2 9h7.6L17 10H7z" fill="#a8d8f0" stroke="#6bb8e0" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M9 10V7a3 3 0 0 1 6 0v3" fill="none" stroke="#6bb8e0" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="tab-label">買い物</span>
      </button>
      <button type="button" id="tab-memory" class="tab-btn" role="tab" aria-selected="false">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="5" width="16" height="14" rx="3" fill="#d8c8f8" stroke="#9b7ed8" stroke-width="1.2"/>
          <path d="M8 10h8M8 13h5" fill="none" stroke="#7a58c4" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="tab-label tab-label-memory">記憶<br>メモリ</span>
      </button>
      <button type="button" id="tab-memo" class="tab-btn active" role="tab" aria-selected="true">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 8a5 5 0 0 1 10 0c0 2.5-1.5 4-3 5.5H8C6.5 12 5 10.5 5 8z" fill="#fff3b0" stroke="#e8c84a" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="9" cy="9" r="0.8" fill="#e8c84a"/>
          <circle cx="12" cy="8" r="0.8" fill="#e8c84a"/>
          <circle cx="15" cy="9" r="0.8" fill="#e8c84a"/>
        </svg>
        <span class="tab-label">メモ</span>
      </button>
    </nav>
  </div>

  <div id="memory-detail" class="memory-detail hidden">
    <div class="memory-detail-bar">
      <button type="button" id="memory-detail-back" class="btn-memory-nav">戻る</button>
      <button type="button" id="memory-detail-edit" class="btn-memory-nav">編集</button>
    </div>
    <h2 id="memory-detail-fixed-title" class="memory-detail-fixed-title hidden">ごちゃまぜ覚書き</h2>
    <input
      type="text"
      id="memory-detail-title"
      class="memory-detail-title-input"
      placeholder="タイトルを入力"
      maxlength="80"
      autocomplete="off"
    >
    <textarea
      id="memory-detail-body"
      class="memory-detail-body"
      placeholder="メモを入力"
    ></textarea>
  </div>

  <script src="script.js"></script>
</body>
</html>
